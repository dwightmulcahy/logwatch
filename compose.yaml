services:
  logwatch:
    image: dwightmulcahy/logwatcher:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Costa_Rica
      TARGET_CONTAINER: ${TARGET_CONTAINER:-webpage}
      APP_NAME: ${APP_NAME:-webpage}
      RUN_ON_START: "0"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logwatch-data:/data
