services:
  logwatch:
    # Pin a version (e.g. dwightmulcahy/logwatcher:0.1) or use :latest with Watchtower
    image: dwightmulcahy/logwatcher:latest
    container_name: webpage-logwatch
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # store the running log analysis data in the app's directory
      - /share/Data/config/webpage/logwatch-data:/data

      # optional: run a local copy of the script instead of the one in the image
      # - /share/Data/config/logwatch/logwatch.py:/app/logwatch.py:ro
      # - /share/Data/config/logwatch/healthcheck.py:/app/healthcheck.py:ro

    # all the secrets so you don't have them published
    env_file: ${LOGWATCH_ENV_FILE:-/share/Data/config/logwatch/.env}

    environment:
      - TZ=America/Costa_Rica
      - TARGET_CONTAINER=webpage
      - APP_NAME=webpage
      - APP_DESC=My website
      - PROBE_IGNORE=^/admin$
      - MODE=hybrid
      - RUN_AT=07:00
      # set to 0 after the first test email arrives
      - RUN_ON_START=1
      - SEND_IF_CLEAR=1
      - AUTO_IGNORE_HOME=1
      - AUTO_IGNORE_LAN=1

  webpage:
    image: webpage:latest
    container_name: webpage
    restart: unless-stopped
    user: "1000:100"
    ports:
      - "8088:8080"
    environment:
      - TZ=America/Costa_Rica
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - /share/Data/config/webpage:/data
