name: Release

# Two ways to release:
#   1. Actions -> Release -> Run workflow: picks the next version from the
#      conventional commits since the last tag (feat -> minor, fix/other -> patch,
#      "type!:" / BREAKING CHANGE -> major) unless one is typed in, then tags it.
#   2. Push a tag yourself: git tag v1.2.3 && git push origin v1.2.3
# Either way: lint, test, build a multi-arch image, push it to Docker Hub as
# X.Y.Z, X.Y, X and latest (floating tags only for the newest in their line), and create
# a GitHub Release whose notes are grouped by conventional-commit type.
#
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub access token).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.0). Leave empty to compute it from commits."
        required: false
        default: ""

permissions:
  contents: write

env:
  IMAGE: dwightmulcahy/logwatcher

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lint and test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install -q pyflakes -r requirements.txt
          python -m pyflakes logwatch.py scripts/release_notes.py
          python -m py_compile logwatch.py
          python -m unittest discover -s tests -v

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="$(python3 scripts/release_notes.py next)"
          fi
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $v"; exit 1; }
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      - name: Create tag (manual runs)
        if: github.ref_type != 'tag'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      # Floating tags (latest, M, M.m) only move when this is the newest release
      # in that line, so patching an old version never drags them backwards.
      - name: Floating tags
        id: float
        run: |
          v="${{ steps.version.outputs.version }}"
          major="${v%%.*}"; minor="${v%.*}"
          all="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          newest() { grep -m1 -E "^v${1//./\\.}\\." <<<"$all"; }
          {
            echo "major=$major"
            echo "minor=$minor"
            echo "is_latest=$([ "$(head -1 <<<"$all")" = "v$v" ] && echo true || echo false)"
            echo "is_major=$([ "$(newest "$major")" = "v$v" ] && echo true || echo false)"
            echo "is_minor=$([ "$(newest "$minor")" = "v$v" ] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.float.outputs.minor }},enable=${{ steps.float.outputs.is_minor }}
            type=raw,value=${{ steps.float.outputs.major }},enable=${{ steps.float.outputs.is_major }}
            type=raw,value=latest,enable=${{ steps.float.outputs.is_latest }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint python "${IMAGE}:${{ steps.version.outputs.version }}" \
            -c "import docker, anthropic, os; print('ok', os.environ['LOGWATCH_VERSION'])"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py notes "${{ steps.version.outputs.tag }}" > notes.md
          cat notes.md
          gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md --verify-tag \
            $([ "${{ steps.float.outputs.is_latest }}" = "true" ] && echo --latest || echo --latest=false)
