name: Release

# Releases are created only from manually pushed stable version tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: dwightmulcahy/logwatcher

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate stable tag and main ancestry
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  validate:
    needs: verify
    uses: ./.github/workflows/ci.yml
  release:
    needs: [verify, validate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Determine version
        id: version
        run: |
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Floating tags (latest, M, M.m) only move when this is the newest release
      # in that line, so patching an old version never drags them backwards.
      - name: Floating tags
        id: float
        run: |
          v="${{ steps.version.outputs.version }}"
          major="${v%%.*}"; minor="${v%.*}"
          all="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          newest() { grep -m1 -E "^v${1//./\\.}\\." <<<"$all"; }
          {
            echo "major=$major"
            echo "minor=$minor"
            echo "is_latest=$([ "$(head -1 <<<"$all")" = "v$v" ] && echo true || echo false)"
            echo "is_major=$([ "$(newest "$major")" = "v$v" ] && echo true || echo false)"
            echo "is_minor=$([ "$(newest "$minor")" = "v$v" ] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.float.outputs.minor }},enable=${{ steps.float.outputs.is_minor }}
            type=raw,value=${{ steps.float.outputs.major }},enable=${{ steps.float.outputs.is_major }}
            type=raw,value=latest,enable=${{ steps.float.outputs.is_latest }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint python "${IMAGE}:${{ steps.version.outputs.version }}" \
            -c "import docker, anthropic, os; print('ok', os.environ['LOGWATCH_VERSION'])"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py notes "${{ steps.version.outputs.tag }}" > notes.md
          cat notes.md
          tag="${{ steps.version.outputs.tag }}"
          latest=false
          if [ "${{ steps.float.outputs.is_latest }}" = true ]; then latest=true; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md --latest="$latest"
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag --latest="$latest"
          fi
