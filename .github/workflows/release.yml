name: Release

# Releases are triggered only by manually created version tags.
# No workflow creates, increments, or pushes a version tag.
# Floating Docker aliases are gated independently by release line.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false   # never abort a half-published release

permissions:
  contents: read

env:
  IMAGE: dwightmulcahy/logwatcher

jobs:
  validate:
    name: Full CI suite
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Verify existing version tag on main
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      minor: ${{ steps.float.outputs.minor }}
      major: ${{ steps.float.outputs.major }}
      is_latest: ${{ steps.float.outputs.is_latest }}
      is_major: ${{ steps.float.outputs.is_major }}
      is_minor: ${{ steps.float.outputs.is_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Commit must be reachable from origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi

      - name: Validate existing version tag
        id: version
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Bad version: $v"; exit 1; }
          [[ "$v" == *-* ]] && pre=true || pre=false
          { echo "tag=$v"; echo "version=${v#v}"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

      # Floating tags (latest, M, M.m) only move when this is the newest stable release
      # in that line, so patching an old version never drags them backwards.
      - name: Floating tags
        id: float
        env:
          V: ${{ steps.version.outputs.version }}
          PRE: ${{ steps.version.outputs.prerelease }}
        run: |
          major="${V%%.*}"; minor="${V%.*}"
          all="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          newest() { grep -m1 -E "^v${1//./\\.}\\." <<<"$all"; }
          is() { [ "$PRE" = "false" ] && [ "$1" = "v$V" ] && echo true || echo false; }
          {
            echo "major=$major"
            echo "minor=$minor"
            echo "is_latest=$(is "$(head -1 <<<"$all")")"
            echo "is_major=$(is "$(newest "$major")")"
            echo "is_minor=$(is "$(newest "$minor")")"
          } | tee -a "$GITHUB_OUTPUT"

  docker:
    name: Publish multi-arch image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.is_minor }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.is_major }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_latest }}
      - name: Build and push
        uses: dwightmulcahy/repo-template/.github/actions/docker-publish@5d53ef5f4bc64a296c057d6c64ec10e7a0245c39
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.prepare.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Smoke test published image
        run: |
          docker run --rm --entrypoint python "${IMAGE}:${{ needs.prepare.outputs.version }}" \
            -c "import docker, anthropic, os; print('ok', os.environ['LOGWATCH_VERSION'])"

  release:
    name: GitHub Release
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Generate standard stable release notes
        if: needs.prepare.outputs.prerelease != 'true'
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          project-name: Logwatch
          image: ${{ env.IMAGE }}
          output: notes.md

      - name: Create or update release (idempotent on rerun)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRE: ${{ needs.prepare.outputs.prerelease }}
          IS_LATEST: ${{ needs.prepare.outputs.is_latest }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [[ "$PRE" == "true" ]]; then
            python3 scripts/release_notes.py notes "$TAG" > notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          flags=(--title "$TAG" --notes-file notes.md)
          if [[ "$PRE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          elif [[ "$IS_LATEST" == "true" ]]; then
            flags+=(--latest)
          else
            flags+=(--latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing notes"
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag "${flags[@]}"
          fi
