name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install pyflakes -r requirements.txt
      - name: Lint
        run: python -m pyflakes logwatch.py scripts/release_notes.py tests
      - name: Compile
        run: python -m py_compile logwatch.py scripts/release_notes.py tests/test_claude_prompt_budget.py
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
