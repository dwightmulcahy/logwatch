name: CI

on:
  push:
    branches: ["**"]          # branches only; tags are handled by release.yml
  pull_request:
  workflow_call:              # reused by release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"      # keep in step with the Dockerfile base image
  IMAGE: logwatcher:ci

jobs:
  test:
    name: Shared Python lint and tests
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-python-ci.yml@d89e9db45ba77fd32d95da02620476eada9c01cd
    with:
      python-version: '3.14'
      install-command: pip install -r requirements-dev.txt
      lint-command: |
        ruff check .
        pyflakes logwatch.py scripts tests
      test-command: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q

  compose:
    name: Validate Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
        env:
          LOGWATCH_ENV_FILE: .env

  docker:
    name: Docker image smoke + scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: VERSION=ci-${{ github.sha }}
      - name: Imports and version
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import docker, anthropic, os; print('ok', os.environ['LOGWATCH_VERSION'])"
      - name: Healthcheck fails without heartbeat, passes with one
        run: |
          set -euo pipefail
          hardened=(--rm --read-only --tmpfs /tmp --tmpfs /data
                    --cap-drop ALL --security-opt no-new-privileges:true
                    --pids-limit 100 --memory 512m --entrypoint sh "$IMAGE")
          if docker run "${hardened[@]}" -c 'python /app/logwatch.py --healthcheck'; then
            echo "::error::healthcheck passed with no heartbeat"; exit 1
          fi
          docker run "${hardened[@]}" -c 'touch /data/heartbeat && python /app/logwatch.py --healthcheck'
      - name: Diagnose package versions and Trivy locations
        run: |
          docker run --rm --entrypoint python "$IMAGE" -m pip list --format=freeze
          docker run --rm --entrypoint sh "$IMAGE" -c 'find /usr/local/lib -iname "*dist-info" -print | grep -E "(certifi|msgpack|setuptools|urllib3)" || true'
          docker image inspect "$IMAGE" --format '{{json .RootFS.Layers}}'
      - name: Inspect Trivy vulnerability source paths
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --format json --scanners vuln "$IMAGE" > trivy-diagnostic.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("trivy-diagnostic.json").read_text())
          for result in report.get("Results", []):
              for vuln in result.get("Vulnerabilities", []):
                  if vuln.get("PkgName", "").lower() in {"certifi", "msgpack", "setuptools", "urllib3"}:
                      print(json.dumps({"target": result.get("Target"), "type": result.get("Type"), "package": vuln.get("PkgName"), "version": vuln.get("InstalledVersion"), "fixed": vuln.get("FixedVersion"), "id": vuln.get("VulnerabilityID"), "layer": vuln.get("Layer")}, sort_keys=True))
          PY
      - name: Export final container filesystem for security scan
        run: |
          container_id=$(docker create "$IMAGE")
          mkdir -p "$RUNNER_TEMP/logwatch-rootfs"
          docker export "$container_id" | tar -xf - -C "$RUNNER_TEMP/logwatch-rootfs"
          docker rm "$container_id"
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/logwatch-rootfs
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
